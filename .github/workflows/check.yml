# Checks the definitions and the signed site on every push and pull request,
# and once a week, so a catalogue near its expiry fails here a month ahead.
# Actions are pinned to commits, like images are pinned to digests.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # CirrusUX's go.mod at the pinned tag
          cache: false # nothing here to cache
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Definitions and site
        run: scripts/check.sh
